[pytest]
# Pytest Configuration for LLM Observability Demo Tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    integration: Integration tests requiring running OpenWebUI instance
    tempo: Tests that query Grafana Tempo (requires credentials)
    slow: Tests that take a long time to run

# Output
addopts =
    --strict-markers
    --tb=short
    -ra

# Asyncio
asyncio_mode = auto

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage (if using pytest-cov)
# Uncomment to enable coverage reporting
# addopts = --cov=../../backend/open_webui/utils/telemetry --cov-report=term-missing

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
