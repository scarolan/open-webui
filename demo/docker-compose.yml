name: grafana-cloud-openwebui-demo

services:
  # LiteLLM Proxy - translates OpenAI-format requests to Anthropic's native API
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    networks:
      - demo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Instrumented OpenWebUI - builds from local fork with LLM observability
  openwebui:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    volumes:
      - openwebui-data:/app/backend/data
    environment:
      # Gemini API Configuration
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEFAULT_MODEL=gemini-flash-latest
      - WEBUI_NAME=AI Bot Personalities - LLM Observability Demo

      # OpenWebUI Configuration
      - WEBUI_URL=http://localhost:3000
      - ENABLE_OPENAI_API=false
      - TASK_MODEL_EXTERNAL=models/gemini-flash-latest

      # OpenTelemetry Tracing Configuration
      - ENABLE_OTEL=true
      - ENABLE_OTEL_TRACES=true
      - ENABLE_OTEL_METRICS=false

      # OTLP Exporter Configuration
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_INSECURE=true

      # Service Identification
      - OTEL_SERVICE_NAME=openwebui
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=demo,service.version=instrumented

      # Exclude noisy endpoints from auto-instrumentation
      - OTEL_PYTHON_FASTAPI_EXCLUDED_URLS=/health,/api/health,/api/version,/api/config,/api/models,/api/v1,/api/tasks,/api/files,/api/auths,/api/chat/completed,/static/.*,/assets/.*,.*\.js,.*\.css,.*\.png,.*\.ico,.*\.svg,/ws

      # Disable noisy instrumentations (keep aiohttp for LLM API calls)
      - OTEL_PYTHON_DISABLED_INSTRUMENTATIONS=sqlite3,sqlalchemy,httpx,websocket

      # Logging level (optional - useful for debugging)
      - LOG_LEVEL=INFO

    networks:
      - demo
    restart: unless-stopped
    depends_on:
      otel-collector:
        condition: service_started
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # OpenTelemetry Collector - receives traces and forwards to Grafana Cloud
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.118.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    # No ports exposed to host — internal Docker network only.
    # OpenWebUI sends OTLP to otel-collector:4317 on the demo network.
    # Uncomment to expose for debugging:
    # ports:
    #   - "4317:4317"    # OTLP gRPC receiver
    #   - "4318:4318"    # OTLP HTTP receiver
    #   - "8888:8888"    # Prometheus metrics
    #   - "13133:13133"  # Health check
    environment:
      # Grafana Cloud OTLP endpoint and credentials
      - GRAFANA_OTLP_TOKEN=${GRAFANA_OTLP_TOKEN}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
    networks:
      - demo
    restart: unless-stopped
    # No healthcheck — distroless image has no shell or curl.
    # The collector starts fast and OpenWebUI retries OTLP connections.

networks:
  demo:
    driver: bridge

volumes:
  openwebui-data:
    driver: local
